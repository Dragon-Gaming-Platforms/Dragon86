name: Vendor the Arch blobs

# Publishes a curated subset of copy.sh's Arch root filesystem (~700 MB) to
# the `arch-image` branch of this repo, which is served by
# raw.githubusercontent.com with `Access-Control-Allow-Origin: *` — a host that
# does not require the Referer a browser cannot forge. That is what makes Full
# Arch work in Safari, and it is the fallback for anything the subset misses.
#
# Why not everything: the image is 5.3 GB (Rust, LLVM, JVM, GPU drivers,
# Firefox, the package cache...). GitHub caps a Pages site at 1 GB and starts
# complaining about repos soon after. The selection rule lives in
# tools/arch-image/vendor.py and keeps the boot files, the whole userland and
# the libraries they need.
#
# Resumable: the branch is cloned first and the downloader skips blobs that are
# already there, so a second run against an unchanged image downloads nothing.
#
# Runs when the image list changes, when the rule changes, or on demand (touch
# tools/arch-image/vendor-request to trigger it by push).

on:
  push:
    branches: [main]
    paths:
      - "public/v86/fs.json"
      - "tools/arch-image/vendor.py"
      - "tools/arch-image/vendor-request"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-arch-blobs
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to vendor
        run: python3 tools/arch-image/vendor.py --plan

      - name: Prepare the publishing branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin arch-image >/dev/null 2>&1; then
            git clone -q --depth 1 --branch arch-image "$url" /tmp/pub
            echo "resuming: $(ls /tmp/pub/arch 2>/dev/null | wc -l) blobs already published"
          else
            mkdir -p /tmp/pub && cd /tmp/pub && git init -q -b arch-image
            git remote add origin "$url"
            echo "first run: starting an empty branch"
          fi
          cd /tmp/pub
          git config user.name "dragon86-vendor[bot]"
          git config user.email "dragon86-vendor@users.noreply.github.com"

      - name: Download what is missing
        run: |
          set -uo pipefail
          # Best effort by design: whatever made it gets published, and the app
          # falls back to the upstream store for the rest.
          python3 tools/arch-image/vendor.py --out /tmp/pub --jobs 24 \
            || V86_IMAGE_BASE=http://i.copy.sh/ python3 tools/arch-image/vendor.py --out /tmp/pub --jobs 24 \
            || echo "::warning::some blobs could not be downloaded; publishing what we have"

      - name: Verify the bytes match their names
        continue-on-error: true
        run: python3 tools/arch-image/vendor.py --verify --out /tmp/pub

      - name: Publish
        run: |
          set -euo pipefail
          cd /tmp/pub
          : > .nojekyll
          cat > README.md <<EOF
          Arch image mirror for Dragon86.

          Served at https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/arch-image/

          Generated by .github/workflows/vendor-arch-blobs.yml — do not edit by hand.
          Selection rule: tools/arch-image/vendor.py in the main branch.
          EOF
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          files=$(ls arch | wc -l)
          size=$(du -sh arch | cut -f1)
          git commit -q -m "Vendor Arch blobs: $files files, $size"
          git push -f origin arch-image
          echo "::notice::published $files blobs ($size) to the arch-image branch"
