name: Build netbsd64 guest

# Builds public/netbsd64/ — NetBSD 11.0 for the ARM64 (v64 virt) machine —
# and commits it to the branch the workflow ran on.
#
#   kernel.img.gz        the official netbsd-GENERIC64.img kernel: a
#                        Linux-boot-header image NetBSD publishes exactly so
#                        firmware-less loaders (U-Boot booti, QEMU -kernel,
#                        and v64's virt board) can start it directly
#   root.img.gz.NN       a trimmed NetBSD root disk (GPT + one FFS partition,
#                        label d86root), gzipped and split into chunks under
#                        GitHub's 100 MB file limit
#   manifest.json        part list, sizes and sha256s for the App Store
#
# Why a workflow: cdn.netbsd.org and qemu-system-aarch64 are out of the
# development sandbox's reach. The root disk is assembled by booting the
# official live image once under QEMU (tools/netbsd64/guest-driver.py drives
# the serial console) and copying the system minus the X11 sets and
# man/doc pages onto a fresh disk; the result is then BOOT-TESTED alone,
# with the same direct-kernel boot the browser machine uses, before it
# ships. No hand-built binaries: every byte in the image comes from the
# official NetBSD 11.0 release.
#
# Triggers: pushing this file or the tools/netbsd64 scripts, or a dispatch.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-netbsd64.yml"
      - "tools/netbsd64/**"

permissions:
  contents: write

concurrency: build-netbsd64

env:
  NETBSD_VERSION: "11.0"
  NETBSD_URL: https://cdn.netbsd.org/pub/NetBSD/NetBSD-11.0/evbarm-aarch64/binary
  ROOT_IMG_MIB: "1280"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Dragon86
        uses: actions/checkout@v4

      - name: Install QEMU and pexpect
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils python3-pexpect
          qemu-system-aarch64 --version

      - name: Download NetBSD ${{ env.NETBSD_VERSION }} (kernel + official live image)
        shell: bash
        run: |
          mkdir -p work
          curl -fL --retry 3 -o work/netbsd-GENERIC64.img.gz "$NETBSD_URL/kernel/netbsd-GENERIC64.img.gz"
          curl -fL --retry 3 -o work/kernel.SHA512 "$NETBSD_URL/kernel/SHA512"
          curl -fL --retry 3 -o work/arm64.img.gz "$NETBSD_URL/gzimg/arm64.img.gz"
          curl -fL --retry 3 -o work/gzimg.SHA512 "$NETBSD_URL/gzimg/SHA512"
          cd work
          for pair in "kernel.SHA512 netbsd-GENERIC64.img.gz" "gzimg.SHA512 arm64.img.gz"; do
            set -- $pair
            want=$(awk -F' = ' -v f="SHA512 ($2)" '$1==f {print $2}' "$1")
            got=$(sha512sum "$2" | awk '{print $1}')
            echo "$2: want $want"
            echo "$2: got  $got"
            test -n "$want" && test "$want" = "$got"
          done

      - name: Assemble the trimmed root disk (QEMU, serial-driven)
        shell: bash
        run: |
          gunzip -c work/netbsd-GENERIC64.img.gz > work/netbsd-GENERIC64.img
          gunzip -c work/arm64.img.gz > work/arm64.img
          truncate -s "${ROOT_IMG_MIB}M" work/root.img
          # the official image's GPT holds wedges dk0 (EFI) and dk1 (FFS root)
          python3 tools/netbsd64/guest-driver.py \
            --kernel work/netbsd-GENERIC64.img \
            --disk work/arm64.img --disk work/root.img \
            --root dk1 --script tools/netbsd64/assemble.cmds \
            --timeout 3000 | tee work/assemble.log

      - name: Boot-test the image alone (direct kernel boot, like the browser)
        shell: bash
        run: |
          python3 tools/netbsd64/guest-driver.py \
            --kernel work/netbsd-GENERIC64.img \
            --disk work/root.img \
            --root NAME=d86root --script tools/netbsd64/verify.cmds \
            --timeout 3000 | tee work/verify.log
          grep "NetBSD dragon86-netbsd ${NETBSD_VERSION}" work/verify.log

      - name: Package into public/netbsd64
        shell: bash
        run: |
          rm -rf public/netbsd64
          mkdir -p public/netbsd64
          cp work/netbsd-GENERIC64.img.gz public/netbsd64/kernel.img.gz
          gzip -9c work/root.img > work/root.img.gz
          split -b 94371840 -d -a 2 work/root.img.gz public/netbsd64/root.img.gz.
          ls -la public/netbsd64
          python3 - <<'EOF'
          import hashlib, json, os, glob
          def sha256(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()
          parts = sorted(os.path.basename(p) for p in glob.glob("public/netbsd64/root.img.gz.*"))
          manifest = {
              "os": "NetBSD",
              "version": os.environ["NETBSD_VERSION"],
              "arch": "arm64",
              "kernel": {
                  "file": "kernel.img.gz",
                  "gzBytes": os.path.getsize("public/netbsd64/kernel.img.gz"),
                  "rawBytes": os.path.getsize("work/netbsd-GENERIC64.img"),
                  "sha256": sha256("public/netbsd64/kernel.img.gz"),
              },
              "root": {
                  "parts": [{"file": p, "bytes": os.path.getsize("public/netbsd64/" + p),
                             "sha256": sha256("public/netbsd64/" + p)} for p in parts],
                  "gzBytes": os.path.getsize("work/root.img.gz"),
                  "rawBytes": os.path.getsize("work/root.img"),
                  "rawSha256": sha256("work/root.img"),
                  "rootArg": "NAME=d86root",
              },
          }
          with open("public/netbsd64/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF
          cat > public/netbsd64/app-manifest.json <<'EOF'
          {
            "id": "netbsd-arm64",
            "kind": "disk-image",
            "distro": "netbsd64",
            "arch": [
              "arm64"
            ],
            "kernel": "kernel.img.gz",
            "image": "root.img.gz",
            "manifest": "manifest.json",
            "note": "NetBSD boots from its own virtio disk image, not from the OS filesystem: the App Store reassembles root.img.gz.NN into the ARM64 machine's disk storage, and all changes live inside that image. Only the ARM64 machine can boot it."
          }
          EOF
          {
            echo "# public/netbsd64 — vendored NetBSD ${NETBSD_VERSION} (ARM64) guest"
            echo
            echo "Built by the 'Build netbsd64 guest' workflow — not written by hand."
            echo
            echo "- kernel.img.gz: the official netbsd-GENERIC64.img kernel from"
            echo "  cdn.netbsd.org (NetBSD ${NETBSD_VERSION}, evbarm-aarch64), SHA512-verified."
            echo "  It carries a Linux-style boot header, so the v64 ARM64 virt"
            echo "  machine boots it directly — no UEFI involved."
            echo "- root.img.gz.NN: a ${ROOT_IMG_MIB} MiB GPT disk (one FFS partition,"
            echo "  label d86root) holding the official live image's system minus"
            echo "  the X11 sets, man/doc/httpd pages and /usr/include, assembled"
            echo "  and boot-tested under qemu-system-aarch64 by this workflow."
            echo "  Boot-test: direct kernel boot, root=NAME=d86root, to a root"
            echo "  login on the serial console."
            echo "- Licensing: NetBSD's BSD licenses; see /usr/share/legal in the"
            echo "  image and https://www.netbsd.org/about/redistribution.html"
            echo
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ) by GitHub Actions run ${{ github.run_id }}"
            echo "Rebuild: run the 'Build netbsd64 guest' workflow (it overwrites these files)."
          } > public/netbsd64/VENDORED.md
          du -sh public/netbsd64

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/netbsd64
          if git diff --cached --quiet; then
            echo "build output unchanged — nothing to commit"
          else
            git commit -m "Vendor NetBSD ${NETBSD_VERSION} ARM64 guest (kernel + trimmed, boot-tested root disk)"
            # same race-and-retry as the other vendor workflows: another
            # vendor build may win the push; rebase (different directories,
            # always clean) and try again
            for i in 1 2 3; do
              git push origin "HEAD:${{ github.ref_name }}" && break
              git pull --rebase origin "${{ github.ref_name }}"
            done
          fi
