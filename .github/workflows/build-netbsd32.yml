name: Build netbsd32 guest

# Builds public/netbsd32/ — NetBSD 11.0 (evbarm-earmv7hf) for the ARM32 (v64 virt) machine —
# and commits it to the branch the workflow ran on.
#
#   kernel.img.gz        the official netbsd-GENERIC.img kernel: a
#                        Linux-boot-header image NetBSD publishes exactly so
#                        firmware-less loaders (U-Boot booti, QEMU -kernel,
#                        and v64's virt board) can start it directly
#   root.img.gz.NN       a trimmed NetBSD root disk (GPT + one FFS partition,
#                        label d86root), gzipped and split into chunks under
#                        GitHub's 100 MB file limit
#   manifest.json        part list, sizes and sha256s for the App Store
#
# Why a workflow: cdn.netbsd.org and qemu-system-aarch64 are out of the
# development sandbox's reach. The root disk is assembled by booting the
# official live image once under QEMU (tools/netbsd64/guest-driver.py drives
# the serial console) and copying the system minus the X11 sets and
# man/doc pages onto a fresh disk; the result is then BOOT-TESTED alone,
# with the same direct-kernel boot the browser machine uses, before it
# ships. No hand-built binaries: every byte in the image comes from the
# official NetBSD 11.0 release.
#
# Triggers: pushing this file or the tools/netbsd64 scripts, or a dispatch.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-netbsd32.yml"
      - "tools/netbsd64/assemble32.cmds"
      - "tools/netbsd64/guest-driver.py"

permissions:
  contents: write

concurrency: build-netbsd32

env:
  NETBSD_VERSION: "11.0"
  NETBSD_URL: https://cdn.netbsd.org/pub/NetBSD/NetBSD-11.0/evbarm-earmv7hf/binary
  ROOT_IMG_MIB: "1280"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Checkout Dragon86
        uses: actions/checkout@v4

      - name: Install QEMU and pexpect
        run: |
          sudo apt-get update
          # ipxe-qemu: QEMU refuses to start without the virtio option ROM
          # (efi-virtio.rom), even for virtio-mmio disks with no network
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-utils ipxe-qemu python3-pexpect
          qemu-system-arm --version

      - name: Download NetBSD ${{ env.NETBSD_VERSION }} (kernel + official live image)
        shell: bash
        run: |
          mkdir -p work
          curl -fL --retry 8 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o work/netbsd-GENERIC.img.gz "$NETBSD_URL/kernel/netbsd-GENERIC.img.gz"
          curl -fL --retry 8 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o work/netbsd-GENERIC.ub.gz "$NETBSD_URL/kernel/netbsd-GENERIC.ub.gz"
          curl -fL --retry 8 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o work/kernel.SHA512 "$NETBSD_URL/kernel/SHA512"
          curl -fL --retry 8 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o work/armv7.img.gz "$NETBSD_URL/gzimg/armv7.img.gz"
          curl -fL --retry 8 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o work/gzimg.MD5 "$NETBSD_URL/gzimg/MD5"
          cd work
          # the kernel directory publishes SHA512 for the .gz files
          want=$(awk -F' = ' '$1=="SHA512 (netbsd-GENERIC.img.gz)" {print $2}' kernel.SHA512)
          got=$(sha512sum netbsd-GENERIC.img.gz | awk '{print $1}')
          echo "kernel: want $want"
          echo "kernel: got  $got"
          test -n "$want" && test "$want" = "$got"
          want=$(awk -F' = ' '$1=="SHA512 (netbsd-GENERIC.ub.gz)" {print $2}' kernel.SHA512)
          got=$(sha512sum netbsd-GENERIC.ub.gz | awk '{print $1}')
          echo "ub kernel: want $want"
          echo "ub kernel: got  $got"
          test -n "$want" && test "$want" = "$got"
          # the gzimg directory's SHA512 file only covers arm64mbr.img;
          # armv7.img is published with an MD5 of the UNCOMPRESSED image, so
          # that is what can be checked (integrity over TLS from the
          # official CDN — upstream offers nothing stronger for this file)
          gunzip -c armv7.img.gz > armv7.img
          want=$(awk -F' = ' '$1=="MD5 (armv7.img)" {print $2}' gzimg.MD5)
          got=$(md5sum armv7.img | awk '{print $1}')
          echo "armv7.img: want $want"
          echo "armv7.img: got  $got"
          test -n "$want" && test "$want" = "$got"

      - name: Find a virt machine type NetBSD/armv7 boots on
        shell: bash
        run: |
          # The .img kernel is a raw objcopy binary (no zImage header) and
          # the default virt board booted it with zero serial output. QEMU's
          # loader explicitly understands the .ub (uImage kernel_noload)
          # format, so probe kernel formats x machine types and keep the
          # first combination that prints the kernel banner. The browser
          # still ships the raw .img: v64 takes a raw kernel buffer, and the
          # .ub is that same binary behind a 64-byte header.
          gunzip -c work/netbsd-GENERIC.img.gz > work/netbsd-GENERIC.img
          gunzip -c work/netbsd-GENERIC.ub.gz > work/netbsd-GENERIC.ub
          pickK=""; pickM=""
          for K in ub img; do
            for M in virt "virt,highmem=off" virt-6.2; do
              tag="$K-$(echo "$M" | tr ,= -)"
              echo "=== probing -kernel .$K -M $M ==="
              (timeout 240 qemu-system-arm -M "$M" -cpu cortex-a15 -smp 2 -m 1024 \
                -display none -monitor none -serial stdio -no-reboot \
                -kernel "work/netbsd-GENERIC.$K" -append "root=ld0a" \
                -device virtio-rng-device || true) 2>&1 | head -c 4000 | tee "work/probe-$tag.log"
              if grep -q "NetBSD" "work/probe-$tag.log"; then pickK="$K"; pickM="$M"; break 2; fi
            done
          done
          echo "picked kernel format: ${pickK:-NONE}, machine: ${pickM:-NONE}"
          test -n "$pickK"
          echo "NB_KERNEL=work/netbsd-GENERIC.$pickK" >> "$GITHUB_ENV"
          echo "NB_MACHINE=$pickM" >> "$GITHUB_ENV"

      - name: Assemble the trimmed root disk (QEMU, serial-driven)
        shell: bash
        run: |
          truncate -s "${ROOT_IMG_MIB}M" work/root.img
          # the official image's GPT holds wedges dk0 (EFI) and dk1 (FFS root)
          python3 tools/netbsd64/guest-driver.py \
            --qemu qemu-system-arm --cpu cortex-a15 --memory 1024 \
            --machine "$NB_MACHINE" \
            --kernel "$NB_KERNEL" \
            --disk work/armv7.img --disk work/root.img \
            --root ld0a,ld1a,ld2a,ld3a,ld4a,ld5a \
            --script tools/netbsd64/assemble32.cmds \
            --timeout 5400 | tee work/assemble.log

      - name: Boot-test the image alone (direct kernel boot, like the browser)
        shell: bash
        run: |
          python3 tools/netbsd64/guest-driver.py \
            --qemu qemu-system-arm --cpu cortex-a15 --memory 1024 \
            --machine "$NB_MACHINE" \
            --kernel "$NB_KERNEL" \
            --disk work/root.img \
            --root NAME=d86root --script tools/netbsd64/verify.cmds \
            --timeout 3000 | tee work/verify.log
          grep "NetBSD dragon86-netbsd ${NETBSD_VERSION}" work/verify.log

      - name: Package into public/netbsd32
        shell: bash
        run: |
          rm -rf public/netbsd32
          mkdir -p public/netbsd32
          cp work/netbsd-GENERIC.img.gz public/netbsd32/kernel.img.gz
          gzip -9c work/root.img > work/root.img.gz
          split -b 94371840 -d -a 2 work/root.img.gz public/netbsd32/root.img.gz.
          ls -la public/netbsd32
          python3 - <<'EOF'
          import hashlib, json, os, glob
          def sha256(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()
          parts = sorted(os.path.basename(p) for p in glob.glob("public/netbsd32/root.img.gz.*"))
          manifest = {
              "os": "NetBSD",
              "version": os.environ["NETBSD_VERSION"],
              "arch": "arm32",
              "kernel": {
                  "file": "kernel.img.gz",
                  "gzBytes": os.path.getsize("public/netbsd32/kernel.img.gz"),
                  "rawBytes": os.path.getsize("work/netbsd-GENERIC.img"),
                  "sha256": sha256("public/netbsd32/kernel.img.gz"),
              },
              "root": {
                  "parts": [{"file": p, "bytes": os.path.getsize("public/netbsd32/" + p),
                             "sha256": sha256("public/netbsd32/" + p)} for p in parts],
                  "gzBytes": os.path.getsize("work/root.img.gz"),
                  "rawBytes": os.path.getsize("work/root.img"),
                  "rawSha256": sha256("work/root.img"),
                  "rootArg": "NAME=d86root",
              },
          }
          with open("public/netbsd32/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          # app-manifest.json: what the App Store reads. `files` is the real
          # download list (kernel + the split image parts) so the store can
          # measure the download size honestly, part count included.
          app_manifest = {
              "id": "netbsd-arm32",
              "kind": "disk-image",
              "distro": "netbsd64",
              "arch": ["arm32"],
              "kernel": "kernel.img.gz",
              "image": "root.img.gz",
              "manifest": "manifest.json",
              "files": ["kernel.img.gz"] + parts,
              "note": "NetBSD boots from its own virtio disk image, not from the OS filesystem: the App Store streams root.img.gz.NN into browser storage (OPFS) as the ARM32 machine's disk, and all changes live inside that image. Only the ARM32 machine can boot it.",
          }
          with open("public/netbsd32/app-manifest.json", "w") as f:
              json.dump(app_manifest, f, indent=2)
          EOF
          {
            echo "# public/netbsd32 — vendored NetBSD ${NETBSD_VERSION} (ARM32, evbarm-earmv7hf) guest"
            echo
            echo "Built by the 'Build netbsd32 guest' workflow — not written by hand."
            echo
            echo "- kernel.img.gz: the official netbsd-GENERIC.img kernel from"
            echo "  cdn.netbsd.org (NetBSD ${NETBSD_VERSION}, evbarm-earmv7hf), SHA512-verified."
            echo "  It carries a Linux-style boot header, so the v64 ARM32 virt"
            echo "  machine boots it directly — no UEFI involved."
            echo "- root.img.gz.NN: a ${ROOT_IMG_MIB} MiB GPT disk (one FFS partition,"
            echo "  label d86root) holding the official live image's system minus"
            echo "  the X11 sets, man/doc/httpd pages and /usr/include, assembled"
            echo "  and boot-tested under qemu-system-arm by this workflow."
            echo "  Boot-test: direct kernel boot, root=NAME=d86root, to a root"
            echo "  login on the serial console."
            echo "- Licensing: NetBSD's BSD licenses; see /usr/share/legal in the"
            echo "  image and https://www.netbsd.org/about/redistribution.html"
            echo
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ) by GitHub Actions run ${{ github.run_id }}"
            echo "Rebuild: run the 'Build netbsd32 guest' workflow (it overwrites these files)."
          } > public/netbsd32/VENDORED.md
          du -sh public/netbsd32

      - name: Export failure logs to the branch (the dev sandbox cannot read Actions logs)
        if: failure()
        run: |
          { for f in work/*.log; do echo "=== tail -n 600 $f ==="; tail -n 600 "$f"; done; } \
            > tools/netbsd64/netbsd32-fail.log 2>&1 || true
          git config user.name "dragon86-bot"
          git config user.email "dragon86-bot@users.noreply.github.com"
          git add tools/netbsd64/netbsd32-fail.log
          git commit -m "netbsd32 build: failure log (auto-exported for the sandbox)"
          for i in 1 2 3; do git push && exit 0 || git pull --rebase; done
          git push

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/netbsd32
          if git diff --cached --quiet; then
            echo "build output unchanged — nothing to commit"
          else
            git commit -m "Vendor NetBSD ${NETBSD_VERSION} ARM32 guest (kernel + trimmed, boot-tested root disk)"
            # same race-and-retry as the other vendor workflows: another
            # vendor build may win the push; rebase (different directories,
            # always clean) and try again
            for i in 1 2 3; do
              git push origin "HEAD:${{ github.ref_name }}" && break
              git pull --rebase origin "${{ github.ref_name }}"
            done
          fi
