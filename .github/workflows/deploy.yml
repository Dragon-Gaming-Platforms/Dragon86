name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The Arch guest's file list (fs.json). The app prefers a copy served
      # from our own origin over fetching it from i.copy.sh, which answers
      # 403 to some browsers — so make sure the build has one. If the repo
      # already has it (the Vendor workflow commits it on every push), use
      # that; otherwise fetch it here. Either way it is best-effort: without
      # it the app falls back to a per-device vendored copy or the origin.
      - name: Ensure the Arch image file list is in the build
        continue-on-error: true
        run: |
          if [ -s public/v86/fs.json ]; then
            echo "using the committed copy ($(wc -c < public/v86/fs.json) bytes)"
            exit 0
          fi
          python3 tools/arch-image/mirror.py --list-only public/v86/fs.json \
            || V86_IMAGE_BASE=http://i.copy.sh/ python3 tools/arch-image/mirror.py --list-only public/v86/fs.json \
            || echo "::warning::could not vendor fs.json - the app will use a vendored copy or the origin"

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
