# Save this file in the image repo at exactly:
#
#     .github/workflows/mirror.yml
#
# (the .github folder is hidden — on github.com use "Add file → Create new
# file" and type the full path including .github/workflows/, which creates
# the folders for you).
#
# It expects mirror.py next to the repo root, i.e. <repo>/mirror.py, and
# calls it with a relative path ("python3 mirror.py site"), which resolves
# against the checkout root.
#
# Downloads copy/v86's Arch Linux filesystem image (fs.json + the
# content-addressed blob store) and publishes it to GitHub Pages, so
# Dragon86's v86 engine can boot a full Arch guest with root=host9p.
#
# Run it by hand from the Actions tab: it is a one-off mirror, not a
# per-commit build.

name: Mirror Arch image

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Image root (the directory holding fs.json), with trailing slash"
        default: "https://i.copy.sh/"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the layout
        run: |
          ls -l mirror.py
          pwd

      - name: Download the image
        env:
          V86_IMAGE_BASE: ${{ inputs.source }}
          JOBS: "16"
        run: |
          python3 mirror.py site
          du -sh site
          ls -l site/fs.json
          echo "blobs: $(ls site/arch | wc -l)"
          # Pages refuses single files over 100 MB; surface that here
          # rather than in the deploy step.
          find site -type f -size +100M -print

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Where it landed
        run: |
          echo "fs.json: ${{ steps.deploy.outputs.page_url }}fs.json"
          echo "blobs:   ${{ steps.deploy.outputs.page_url }}arch/"
