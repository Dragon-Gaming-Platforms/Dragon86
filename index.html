<!doctype html>
<html lang="en" data-theme="dragon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Dragon86 — a web OS by Dragon Gaming Platforms" />
    <title>Dragon86</title>
    <link rel="icon" type="image/png" href="./icons/dragon-gaming.png" />
    <!--
      Cross-origin isolation for THIS page, via coi-serviceworker (MIT,
      (c) Guido Zuidhof — see third-party/coi-serviceworker.LICENSE).
      GitHub Pages cannot set COOP/COEP headers, so this service worker
      (scoped to /Dragon86/ by its file location) stamps them onto our
      DOCUMENT responses only — subresources pass through untouched
      (local modification, see the banner in coi-serviceworker.js). This
      page must be cross-origin isolated because the CheerpX hoster runs
      in a hidden iframe: an embedded frame can only get SharedArrayBuffer
      when the top page is isolated. First-ever visit: the worker installs
      and reloads the page once — expected. Force require-corp
      (credentialless off) for Safari compatibility, matching
      CheerpX-Bridge. This must load before any other script.
    -->
    <script>
      /* Dynamic COI: the coi worker is only wanted when the engine runs
         embedded (Settings → Engine → "Embedded"). "Separate tab" and
         "v86 (compatibility)" need no isolation at all — v86 uses no
         SharedArrayBuffer — so in those modes the worker must not merely
         stop registering: it has to be actively removed, and the document
         has to be reloaded to shed the COOP/COEP headers it already
         stamped. That removal is done deterministically by the worker
         script's page half (navigator.serviceWorker.getRegistrations() →
         unregister → one reload), which reads shouldDeregister() below.
         Switching modes in Settings also drops the registration before
         reloading, so there is only ever one reload. */

      /* The flag the worker script's page half acts on. Kept in one place so
         "which engines want isolation" has a single answer. */
      (function () {
        var tabMode = false;
        try {
          var s = JSON.parse(localStorage.getItem("dragon86.settings") || "{}");
          tabMode = s.engineMode === "tab" || s.engineMode === "v86";
        } catch (e) {
          /* no settings yet → embedded default */
        }
        window.coi = {
          coepCredentialless: () => false,
          shouldRegister: () => !tabMode,
          shouldDeregister: () => tabMode,
        };
        window.dragon86Isolation = {
          mode: tabMode ? "off" : "on",
          engine: (function () {
            try {
              return JSON.parse(localStorage.getItem("dragon86.settings") || "{}").engineMode || "embedded";
            } catch (e) {
              return "embedded";
            }
          })(),
        };
      })();
    </script>
    <script src="./coi-serviceworker.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- crossorigin=anonymous: under COEP require-corp, cross-origin
         subresources must pass CORS (Google Fonts serves ACAO:*). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="boot">
      <div class="boot-logo">
        <img class="boot-dragon" src="./icons/dragon-gaming.png" alt="Dragon Gaming Platforms" />
        <h1>DRAGON<span>86</span></h1>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
        <p class="boot-status">Initializing…</p>
      </div>
    </div>
    <div id="os" hidden>
      <div id="desktop"></div>
      <div id="windows"></div>
      <div id="taskbar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
