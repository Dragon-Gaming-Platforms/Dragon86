<!doctype html>
<html lang="en" data-theme="dragon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Dragon86 — a web OS by Dragon Gaming Platforms" />
    <title>Dragon86</title>
    <link rel="icon" type="image/png" href="./icons/dragon-gaming.png" />
    <!--
      coi-serviceworker (MIT, (c) Guido Zuidhof — see
      third-party/coi-serviceworker.LICENSE) is kept ONLY to clean up
      after older Dragon86 versions that registered it for cross-origin
      isolation. Nothing needs isolation now; the inline config below
      disables registration and forces deregistration. This must load
      before any other script.
    -->
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S4TPLRML58"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-S4TPLRML58');
</script>
    <script>
      /* COI is permanently OFF: no engine in Dragon86 needs
         SharedArrayBuffer anymore (the in-page emulators run without it;
         the CheerpX engine that needed isolation was removed). The
         coi-serviceworker script stays loaded for one reason only — its
         page half reads shouldDeregister() and actively REMOVES any worker
         a previous Dragon86 version registered, then reloads once to shed
         the stamped COOP/COEP headers. Without that, returning visitors
         would be stuck isolated forever. */
      (function () {
        window.coi = {
          coepCredentialless: () => false,
          shouldRegister: () => false,
          shouldDeregister: () => true,
        };
        window.dragon86Isolation = { mode: "off", engine: "in-page" };
      })();
    </script>
    <script src="./coi-serviceworker.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- crossorigin=anonymous: under COEP require-corp, cross-origin
         subresources must pass CORS (Google Fonts serves ACAO:*). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="boot">
      <div class="boot-logo">
        <img class="boot-dragon" src="./icons/dragon-gaming.png" alt="Dragon Gaming Platforms" />
        <h1>DRAGON<span>86</span></h1>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
        <p class="boot-status">Initializing…</p>
      </div>
    </div>
    <div id="os" hidden>
      <div id="desktop"></div>
      <div id="windows"></div>
      <div id="taskbar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
