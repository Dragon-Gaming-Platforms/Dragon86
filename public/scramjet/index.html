<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Dragon86 Browser</title>
		<style>
			:root { color-scheme: dark; }
			* { box-sizing: border-box; }
			html, body { height: 100%; }
			body {
				margin: 0; display: flex; flex-direction: column;
				background: #0b0e14; color: #d7dee9;
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			header {
				display: flex; align-items: center; gap: 6px;
				padding: 8px; background: #11161f; border-bottom: 1px solid #232c3d;
				flex-wrap: wrap;
			}
			button {
				background: #171d29; color: #d7dee9; border: 1px solid #2a3448;
				border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 14px;
			}
			button:hover { background: #1f2735; }
			button:disabled { opacity: .45; cursor: default; }
			form { flex: 1; display: flex; min-width: 160px; }
			input[type="text"], input[type="url"], select {
				background: #0b0e14; color: #d7dee9; border: 1px solid #2a3448;
				border-radius: 6px; padding: 7px 10px; font-size: 14px;
			}
			#url { flex: 1; width: 100%; }
			#status {
				padding: 4px 10px; font-size: 12px; color: #8a97a9;
				background: #0d1119; border-bottom: 1px solid #1c2331;
				white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
			}
			#status.error { color: #ff8888; }
			#settings {
				display: none; gap: 6px; align-items: center; flex-wrap: wrap;
				padding: 8px; background: #0d1119; border-bottom: 1px solid #1c2331;
				font-size: 13px;
			}
			#settings.open { display: flex; }
			#settings input { flex: 1; min-width: 220px; }
			main { flex: 1; display: flex; min-height: 0; }
			iframe { flex: 1; border: 0; background: #fff; width: 100%; height: 100%; }
		</style>
		<!-- Scramjet runtime + controller (vendored, see VENDORED.md).
		     Order matters: the controller asserts the runtime is loaded. -->
		<script src="./scramjet/scramjet.js"></script>
		<script src="./controller/controller.api.js"></script>
	</head>
	<body>
		<header>
			<button id="back" title="Back">←</button>
			<button id="forward" title="Forward">→</button>
			<button id="reload" title="Reload">⟳</button>
			<button id="home" title="Home">⌂</button>
			<form id="go-form">
				<input id="url" type="text" spellcheck="false" autocomplete="off"
					placeholder="Enter a URL or search with DuckDuckGo…" />
			</form>
			<button id="settings-btn" title="Proxy settings">⚙</button>
		</header>
		<div id="settings">
			<label>Wisp server
				<input id="wisp" type="url" spellcheck="false" />
			</label>
			<label>Transport
				<select id="transport">
					<option value="epoxy">Epoxy</option>
					<option value="libcurl">Libcurl</option>
				</select>
			</label>
			<button id="save-settings">Save &amp; reconnect</button>
			<span>Proxy traffic goes through the Wisp server — use one you trust.</span>
		</div>
		<div id="status">Starting Scramjet…</div>
		<main><iframe id="view" title="Browser view"></iframe></main>
		<script type="module" src="./app.js"></script>
	</body>
</html>
