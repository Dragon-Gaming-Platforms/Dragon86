<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon86 AI</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;background:#0b0d12;color:#edf0f7}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 80% 0,#391016 0,transparent 45%),#0b0d12}.top{padding:12px 18px;border-bottom:1px solid #282b33;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.dragon{font-size:24px}.title{font-size:17px;font-weight:700}.top small{display:block;color:#a0a5b2}.controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}.controls label{display:flex;align-items:center;gap:6px;color:#b8bdc9;font-size:12px}.select,.key-input{background:#181b23;color:#eee;border:1px solid #373b47;border-radius:8px;padding:8px;min-width:150px}.select:focus,.key-input:focus,textarea:focus{outline:2px solid #a93a46;outline-offset:1px}.model-select{max-width:270px}.refresh,.connect{background:#242832;color:#f2f3f7;border:1px solid #424753;border-radius:8px;padding:8px 10px;cursor:pointer}.credentials{padding:9px 18px;border-bottom:1px solid #242832;background:#10131a;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.credentials[hidden]{display:none}.credentials .key-input{flex:1;min-width:220px}.credential-note{color:#a0a5b2;font-size:12px}.credential-note a,.notice a{color:#ff8790}.provider-status{margin-left:auto;color:#a0a5b2;font-size:12px}.messages{flex:1;overflow:auto;padding:24px max(20px,calc((100% - 760px)/2));display:flex;flex-direction:column;gap:14px}.bubble{max-width:100%;white-space:pre-wrap;padding:13px 16px;border-radius:12px;background:#171a22;border:1px solid #282b34}.user{align-self:flex-end;background:#351419;border-color:#6b252c}.notice{color:#b4bac6;text-align:center;margin:auto;max-width:580px}.composer{padding:14px max(20px,calc((100% - 760px)/2));border-top:1px solid #282b33;display:flex;gap:10px}.composer textarea{resize:vertical;min-height:48px;max-height:180px;flex:1;background:#151821;color:#fff;border:1px solid #383c48;border-radius:10px;padding:12px;font:inherit}.composer button{border:0;border-radius:10px;padding:0 20px;background:#d52231;color:white;font-weight:700;cursor:pointer}.composer button:disabled,.refresh:disabled{opacity:.5;cursor:wait}.model-status{font-size:12px;color:#a0a5b2}.model-status.error{color:#ff9299}a{color:#ff8790}@media(max-width:720px){.controls{margin-left:0;width:100%}.controls label{flex:1}.controls .select{min-width:0;max-width:55vw}.credentials{align-items:flex-start}.provider-status{margin-left:0;width:100%}}
</style></head>
<body>
<header class="top"><span class="dragon">🐉</span><div><div class="title">Dragon86 AI</div><small>Choose a provider and model. Requests go directly from this browser to that provider.</small></div>
<div class="controls"><label>Provider <select class="select" id="provider"><option value="openrouter">OpenRouter</option><option value="pollinations">Pollinations.ai</option><option value="huggingface">Hugging Face</option></select></label><label>Model <select class="select model-select" id="model" aria-label="Model"></select></label><button class="refresh" id="refresh" type="button" title="Refresh available models">↻ Models</button></div></header>
<section class="credentials" id="credentials"><input class="key-input" id="api-key" type="password" autocomplete="off" spellcheck="false"><button class="connect" id="save-key" type="button">Save key</button><span class="credential-note" id="credential-note"></span><span class="provider-status" id="provider-status" role="status"></span></section>
<main class="messages" id="messages"><div class="notice" id="notice"></div></main>
<form class="composer" id="form"><textarea id="prompt" placeholder="Message Dragon86 AI…" aria-label="Message"></textarea><button id="send">Send</button></form>
<script>
const providers={
  openrouter:{label:'OpenRouter',url:'https://openrouter.ai/api/v1/chat/completions',models:'https://openrouter.ai/api/v1/models',key:'dragon86.openrouter.key',fallback:[['openrouter/auto','OpenRouter Auto'],['openai/gpt-4o-mini','GPT-4o mini'],['google/gemini-2.0-flash-001','Gemini 2.0 Flash']]},
  pollinations:{label:'Pollinations.ai',url:'https://gen.pollinations.ai/v1/chat/completions',models:'https://gen.pollinations.ai/text/models',key:'dragon86.pollinations.access',fallback:[['openai/gpt-5.4-nano','OpenAI GPT-5.4 Nano'],['openai','OpenAI (default)']]},
  huggingface:{label:'Hugging Face',url:'https://router.huggingface.co/v1/chat/completions',models:'https://router.huggingface.co/v1/models',key:'dragon86.huggingface.key',fallback:[['openai/gpt-oss-120b:fastest','GPT OSS 120B (fastest)'],['deepseek-ai/DeepSeek-R1:fastest','DeepSeek R1 (fastest)']]}
};
const providerSelect=document.querySelector('#provider'),modelSelect=document.querySelector('#model'),keyInput=document.querySelector('#api-key'),credentials=document.querySelector('#credentials'),keyNote=document.querySelector('#credential-note'),providerStatus=document.querySelector('#provider-status'),modelStatus=document.createElement('span'),refreshButton=document.querySelector('#refresh'),saveKey=document.querySelector('#save-key'),messages=document.querySelector('#messages'),notice=document.querySelector('#notice'),form=document.querySelector('#form'),promptBox=document.querySelector('#prompt'),send=document.querySelector('#send'),conversation=[];
modelStatus.className='model-status';document.querySelector('.controls').append(modelStatus);
providerSelect.value=localStorage.getItem('dragon86.ai.provider')||'openrouter';
function provider(){return providers[providerSelect.value]||providers.openrouter}
function storedKey(p=provider()) {if(providerSelect.value==='pollinations')return sessionStorage.getItem('dragon86.pollinations.access')||'';if(providerSelect.value==='huggingface')return sessionStorage.getItem(p.key)||'';return localStorage.getItem(p.key)||''}
function pollinationsRedirect(){return location.origin+location.pathname+'?pollinations_callback=1'}
function configureCredentials(){const id=providerSelect.value,p=provider(),hasOpenRouter=Boolean(localStorage.getItem('dragon86.openrouter.key')),hasPollinations=Boolean(sessionStorage.getItem('dragon86.pollinations.access'));localStorage.setItem('dragon86.ai.provider',id);
 if(id==='openrouter'){credentials.hidden=false;keyInput.hidden=true;saveKey.textContent=hasOpenRouter?'Connected · Manage in Settings':'Sign in via Settings';saveKey.disabled=hasOpenRouter;keyNote.innerHTML=hasOpenRouter?'Using your OpenRouter sign-in from Settings.':'Connect with OpenRouter OAuth in <a href="#" id="settings-link">Settings → AI</a>.';providerStatus.textContent=hasOpenRouter?'Connected':'Not connected';const link=document.querySelector('#settings-link');if(link)link.addEventListener('click',e=>{e.preventDefault();parent.dispatchEvent(new CustomEvent('d86-launch-app',{detail:'settings'}))});
 }else if(id==='pollinations'){credentials.hidden=false;keyInput.hidden=false;keyInput.type='password';keyInput.value=localStorage.getItem('dragon86.pollinations.app-key')||'';keyInput.placeholder='Pollinations App Key (pk_…)';saveKey.textContent=hasPollinations?'Disconnect this tab':'Connect Pollinations';saveKey.disabled=false;keyNote.innerHTML=`Create an App Key at <a href="https://enter.pollinations.ai/keys?tab=app" target="_blank" rel="noopener">Pollinations Keys</a> and register this exact callback URL: <code>${pollinationsRedirect()}</code>. OAuth returns a short-lived key held in this tab only.`;providerStatus.textContent=hasPollinations?'Connected for this tab':'Not connected';
 }else{credentials.hidden=false;keyInput.hidden=false;keyInput.type='password';keyInput.value=sessionStorage.getItem(p.key)||'';keyInput.placeholder='Hugging Face access token (hf_…)';saveKey.textContent='Save token';saveKey.disabled=false;keyNote.innerHTML='Use a fine-grained token with Inference Providers access. <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener">Manage tokens</a>. This tab only; avoid broad-scope tokens.';providerStatus.textContent=storedKey(p)?'Token saved for this tab':'No token saved'}
}
function showNotice(){const p=provider();notice.textContent=storedKey()?`Ready on ${p.label}. Choose a model and send a message. Usage and billing follow that provider’s account.`:providerSelect.value==='openrouter'?'Sign in to OpenRouter in Settings → AI to enable chat.':providerSelect.value==='pollinations'?'Connect Pollinations with your App Key above. Authorization is user-approved and budget-limited.':'Add a Hugging Face token above to enable chat.'}
function updateModelSelection(wanted){if(wanted&&[...modelSelect.options].some(o=>o.value===wanted))modelSelect.value=wanted;else if(modelSelect.options.length)modelSelect.selectedIndex=0;localStorage.setItem('dragon86.ai.model.'+providerSelect.value,modelSelect.value)}
function addModels(items,wanted){const p=provider(),models=(items||[]).map(m=>typeof m==='string'?{id:m}:m).filter(m=>m&&(typeof m.id==='string'||typeof m.name==='string')).map(m=>[m.id||m.name||m.model,m.name||m.id||m.model]);const unique=[...new Map(models.map(m=>[m[0],m])).values()];const list=unique.length?unique:p.fallback;modelSelect.replaceChildren(...list.slice(0,250).map(([id,name])=>{const o=document.createElement('option');o.value=id;o.textContent=name===id?id:`${name} · ${id}`;return o}));updateModelSelection(wanted||localStorage.getItem('dragon86.ai.model.'+providerSelect.value))}
async function loadModels(){const p=provider(),key=storedKey(p);refreshButton.disabled=true;modelStatus.classList.remove('error');modelStatus.textContent='Loading models…';try{const headers={};if(key)headers.Authorization='Bearer '+key;const r=await fetch(p.models,{headers});if(!r.ok)throw Error('Model list unavailable ('+r.status+')');const data=await r.json(),items=Array.isArray(data)?data:data.data||data.models||[];if(!items.length)throw Error('No models returned');addModels(items);modelStatus.textContent=`${Math.min(items.length,250)} models available`}catch(error){addModels([]);modelStatus.textContent=`Suggested models · ${error.message}`;modelStatus.classList.add('error')}finally{refreshButton.disabled=false;showNotice()}}
async function connectPollinations(){const appKey=keyInput.value.trim()||localStorage.getItem('dragon86.pollinations.app-key');if(!appKey||!appKey.startsWith('pk_')){providerStatus.textContent='Enter your Pollinations App Key (pk_…) first';return}localStorage.setItem('dragon86.pollinations.app-key',appKey);const bytes=crypto.getRandomValues(new Uint8Array(32)),verifier=btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)),challenge=btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),state=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(24)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');sessionStorage.setItem('dragon86.pollinations.verifier',verifier);sessionStorage.setItem('dragon86.pollinations.state',state);const url=new URL('https://enter.pollinations.ai/authorize');for(const [k,v] of Object.entries({response_type:'code',client_id:appKey,redirect_uri:pollinationsRedirect(),scope:'usage',models:'text',budget:'5',expiry:'7',state,code_challenge:challenge,code_challenge_method:'S256'}))url.searchParams.set(k,v);location.assign(url.href)}
async function completePollinationsOAuth(){const q=new URLSearchParams(location.search);if(!q.has('pollinations_callback'))return;providerSelect.value='pollinations';let message='';try{const code=q.get('code'),state=q.get('state'),expected=sessionStorage.getItem('dragon86.pollinations.state'),verifier=sessionStorage.getItem('dragon86.pollinations.verifier'),clientId=localStorage.getItem('dragon86.pollinations.app-key');if(q.get('error'))throw Error(q.get('error_description')||q.get('error'));if(!code||!state||state!==expected||!verifier||!clientId)throw Error('Pollinations sign-in could not be verified. Connect again.');const body=new URLSearchParams({grant_type:'authorization_code',code,client_id:clientId,redirect_uri:pollinationsRedirect(),code_verifier:verifier});const res=await fetch('https://enter.pollinations.ai/api/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const data=await res.json();if(!res.ok||!data.access_token)throw Error(data.error_description||data.error||`Pollinations authorization failed (${res.status})`);sessionStorage.setItem('dragon86.pollinations.access',data.access_token);message='Pollinations connected for this tab.'}catch(error){message=error.message||String(error);sessionStorage.removeItem('dragon86.pollinations.access')}finally{sessionStorage.removeItem('dragon86.pollinations.verifier');sessionStorage.removeItem('dragon86.pollinations.state');history.replaceState({},'',location.pathname);sessionStorage.setItem('dragon86.pollinations.message',message)}}
function bubble(text,who){const b=document.createElement('div');b.className='bubble '+who;b.textContent=text;messages.append(b);messages.scrollTop=messages.scrollHeight;return b}
providerSelect.addEventListener('change',()=>{conversation.length=0;configureCredentials();showNotice();void loadModels()});modelSelect.addEventListener('change',()=>localStorage.setItem('dragon86.ai.model.'+providerSelect.value,modelSelect.value));refreshButton.addEventListener('click',()=>void loadModels());
saveKey.addEventListener('click',()=>{if(providerSelect.value==='openrouter'){parent.dispatchEvent(new CustomEvent('d86-launch-app',{detail:'settings'}));return}if(providerSelect.value==='pollinations'){if(sessionStorage.getItem('dragon86.pollinations.access')){sessionStorage.removeItem('dragon86.pollinations.access');providerStatus.textContent='Disconnected for this tab';configureCredentials();showNotice();return}void connectPollinations();return}const p=provider(),value=keyInput.value.trim();if(!value){sessionStorage.removeItem(p.key);providerStatus.textContent='No token saved';showNotice();return}sessionStorage.setItem(p.key,value);providerStatus.textContent='Token saved for this tab';showNotice();void loadModels()});
form.addEventListener('submit',async e=>{e.preventDefault();const text=promptBox.value.trim(),p=provider(),key=storedKey(p);if(!text)return;if(!key){showNotice();return}promptBox.value='';bubble(text,'user');conversation.push({role:'user',content:text});const answer=bubble('Thinking…','assistant');send.disabled=true;try{const headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'};if(providerSelect.value==='openrouter'){headers['HTTP-Referer']=location.origin;headers['X-Title']='Dragon86 AI'}const res=await fetch(p.url,{method:'POST',headers,body:JSON.stringify({model:modelSelect.value,messages:conversation})});const data=await res.json();if(!res.ok)throw Error(data.error?.message||data.error||('Request failed ('+res.status+')'));const result=data.choices?.[0]?.message?.content;if(!result)throw Error('The provider returned an empty response.');answer.textContent=typeof result==='string'?result:result.map(part=>part.text||'').join('');conversation.push({role:'assistant',content:answer.textContent});providerStatus.textContent=p.label+' · '+modelSelect.value}catch(err){conversation.pop();answer.textContent='Could not get a response: '+err.message}finally{send.disabled=false;messages.scrollTop=messages.scrollHeight}});
async function init(){await completePollinationsOAuth();configureCredentials();addModels([]);const msg=sessionStorage.getItem('dragon86.pollinations.message');if(msg){providerStatus.textContent=msg;sessionStorage.removeItem('dragon86.pollinations.message')}showNotice();await loadModels()}
void init();
</script></body></html>
