<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monaco Editor</title>
    <link rel="icon" href="icon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --bar: #0d0d0d;
        --border: #1f1f1f;
        --text: #f0f0f0;
        --dim: #777;
        --accent: #e60012;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--bar);
        flex: none;
      }
      .bar button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #151515;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .bar button:hover {
        background: #1d1d1d;
      }
      .bar button.primary {
        border-color: var(--accent);
        color: #fff;
        background: #2a0505;
      }
      .bar button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .path {
        margin-left: auto;
        color: var(--dim);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 45%;
      }
      #editor {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .status {
        flex: none;
        padding: 4px 10px;
        border-top: 1px solid var(--border);
        background: var(--bar);
        color: var(--dim);
        font-size: 12px;
        display: flex;
        gap: 12px;
      }
      .splash {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 8px;
        background: var(--bg);
        color: var(--dim);
        font-size: 13px;
        text-align: center;
        padding: 24px;
        z-index: 5;
      }
      .splash strong {
        color: var(--text);
        font-size: 15px;
      }
      .splash.error strong {
        color: #ff6b6b;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="open">Open…</button>
      <button id="save" class="primary">Save</button>
      <span class="path" id="path">(unsaved)</span>
    </div>
    <main>
      <div id="editor"></div>
      <div class="splash" id="splash">
        <strong>Monaco Editor</strong>
        <span id="splash-text">Loading the editor…</span>
      </div>
    </main>
    <div class="status">
      <span id="status-path">not saved</span>
      <span id="status-stats"></span>
      <span id="status-state"></span>
    </div>
    <script src="app.js"></script>
  </body>
</html>
