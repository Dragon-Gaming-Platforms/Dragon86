    <script>
      // The app's scripts wait for Puter's, so the saved or system theme is
      // applied now, before the first paint, as main.js applies it later.
      try {
        const theme = localStorage.getItem("whiteboard-theme") || "system";
        document.documentElement.dataset.theme =
          theme !== "system"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {}
    </script>
