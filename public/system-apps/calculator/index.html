<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calculator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0c0e; color: #eef1f4; font: 15px/1.3 system-ui, sans-serif;
    display: flex; flex-direction: column; gap: 8px; padding: 12px;
  }
  #out {
    min-height: 84px; padding: 10px 12px; border-radius: 8px; background: #111318;
    border: 1px solid #23262d; display: flex; flex-direction: column; justify-content: flex-end;
    text-align: right; overflow: hidden;
  }
  #expr { font-size: 12px; color: #7d858f; min-height: 14px; overflow: hidden; white-space: nowrap; }
  #value { font-size: 34px; font-variant-numeric: tabular-nums; letter-spacing: 1px; overflow: hidden; }
  .pad { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  button {
    border: 1px solid #2a2e36; border-radius: 8px; background: #16191f; color: #eef1f4;
    font: 600 17px/1 system-ui, sans-serif; cursor: pointer; padding: 0;
  }
  button:hover { border-color: #4a505b; }
  button.op { color: #ff8b93; }
  button.eq { background: #e6003c; border-color: #e6003c; color: #fff; }
  button.fn { color: #9aa4ae; font-size: 15px; }
</style>
</head>
<body>
  <div id="out">
    <div id="expr"></div>
    <div id="value">0</div>
  </div>
  <div class="pad">
    <button class="fn" data-k="C">AC</button>
    <button class="fn" data-k="+/-">±</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="/">÷</button>

    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button class="op" data-k="*">×</button>

    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button class="op" data-k="-">−</button>

    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button class="op" data-k="+">+</button>

    <button data-k="0" style="grid-column: span 2">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
  <script src="./app.js"></script>
</body>
</html>
