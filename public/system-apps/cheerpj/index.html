<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CheerpJ</title>
    <link rel="icon" href="icon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08090b;
        --bar: #0d0d0d;
        --border: #1f1f1f;
        --text: #f0f0f0;
        --dim: #777;
        --accent: #e60012;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--bar);
        flex: none;
      }
      .bar button {
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #151515;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .bar button:hover {
        background: #1d1d1d;
      }
      .bar button.primary {
        border-color: var(--accent);
        background: #2a0505;
        color: #fff;
      }
      .bar button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .jar {
        margin-left: auto;
        color: var(--dim);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        max-width: 50%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        background: #000;
      }
      /* CheerpJ draws its windows into this element (cheerpjCreateDisplay). */
      #display {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 28px;
        background: var(--bg);
        color: var(--dim);
        z-index: 4;
      }
      .screen.hidden {
        display: none;
      }
      .screen strong {
        color: var(--text);
        font-size: 15px;
        display: block;
        margin-bottom: 6px;
      }
      .screen.error strong {
        color: #ff6b6b;
      }
      .screen p {
        max-width: 46ch;
        margin: 6px auto;
      }
      .screen code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #ddd;
        background: #151515;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .status {
        flex: none;
        padding: 4px 10px;
        border-top: 1px solid var(--border);
        background: var(--bar);
        color: var(--dim);
        font-size: 12px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .status .grow {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="run" class="primary">Run a .jar…</button>
      <span class="jar" id="jar">no jar selected</span>
    </div>
    <main>
      <div id="display"></div>
      <div class="screen" id="screen">
        <div>
          <strong id="screen-title">CheerpJ — Java in the browser</strong>
          <p id="screen-text">
            Loading the CheerpJ runtime… the first start downloads about 30 MB of
            Java runtime from Leaning Technologies' CDN.
          </p>
          <p id="screen-hint"></p>
        </div>
      </div>
    </main>
    <div class="status">
      <span id="status">idle</span>
      <span class="grow"></span>
      <span id="status-jar"></span>
    </div>
    <script src="app.js"></script>
  </body>
</html>
