  <rect x="12" y="8" width="36" height="9" rx="4" fill="#e8b440"/>
  <rect x="12" y="13" width="36" height="4" fill="#e8b440"/>
  <circle cx="18" cy="12.5" r="1.6" fill="#fdf6e3"/>
  <circle cx="25" cy="12.5" r="1.6" fill="#fdf6e3"/>
  <circle cx="32" cy="12.5" r="1.6" fill="#fdf6e3"/>
  <circle cx="39" cy="12.5" r="1.6" fill="#fdf6e3"/>
  <line x1="17" y1="24" x2="43" y2="24" stroke="#c8bb94" stroke-width="2" stroke-linecap="round"/>
